name: Expo CI
#i think i shall do deploy stuff only when a request is made? 
on:
  pull_request:
    branches: [ "main" ]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3
        
      - name: Expo GitHub Action
        # You may pin to the exact commit or the version.
        # uses: expo/expo-github-action@6a82be3e3ed85d15c05f90d869db8dc95382aef3
        uses: expo/expo-github-action@8.1.0
        with:
          # Expo CLI version to install
          expo-version: "latest" # optional
          # If Expo CLI should be cached to speed up installation
          expo-cache: true # optional, default is true
          # EAS CLI version to install
          eas-version: "latest" # optional
          # If EAS CLI should be cached to speed up installation
          eas-cache: true # optional, default is true
          # The package manager used to install the CLIs
          packager: npm # optional, default is yarn
          # If the action should patch the ENOSPC errors
          patch-watchers: true # optional, default is true
          # Your Expo token, for authentication. (use with secrets)
          token: ${{ secrets.EXPODEPLOYSEC }}# optional
          # A custom remote cache key to use for EAS CLI.
          #eas-cache-key: # optional }i am commenting out coz shld cache by default
          # A custom remote cache key to use for Expo CLI.
          #expo-cache-key: # optional }i am commenting out coz shld cache by default
          # Your Expo username, for authentication.
          username: "deepamalika" # optional
          # Your Expo password, for authentication. (use with secrets)
          password: ${{ secrets.EXPOPASS }}# optional
                      